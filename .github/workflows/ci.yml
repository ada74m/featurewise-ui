# Builds and tests the shell, checks its Terraform and packages it, on every pull request and push to
# main. Each push to main also publishes the package, versioned by date and run, to the estate's
# artifacts bucket, and tags the commit with that version. And it publishes the npm package that services'
# modules build with, @ada74m/featurewise-ui (the contract's types and the module builder), to this
# account's GitHub Packages registry, as 0.1.0-preview.<run>, as the library's NuGet packages are.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.4

      - name: Check Terraform
        run: terraform fmt -check -recursive . && cd Infrastructure && terraform init -backend=false -input=false && terraform validate

      # Pull requests get a version too, so their package can be inspected, but only main's are published.
      - name: Choose a version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "version=$(date -u +%Y.%m.%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "version=pr${{ github.event.number }}.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: ./package.sh "${{ steps.version.outputs.version }}" out

      - uses: actions/upload-artifact@v7
        with:
          name: ui-${{ steps.version.outputs.version }}
          path: out/ui-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  # A repository whose modules use the package needs read access to it: the package's settings, Manage
  # Actions access.
  publish-package:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@ada74m"

      - run: npm ci
      - run: npm run build
      - run: npm version "0.1.0-preview.${{ github.run_number }}" --no-git-tag-version
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Needs the estate's bootstrap: the repository variable AWS_REGION, the secrets ARTIFACTS_BUCKET and
  # PUBLISH_ROLE_ARN (secrets, so the logs don't show the account they name), and the role it names,
  # which trusts only this repository's main branch.
  publish:
    needs: build
    if: github.event_name == 'push' && vars.AWS_REGION != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-${{ needs.build.outputs.version }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish the package
        run: aws s3 cp "ui-$VERSION.zip" "s3://${{ secrets.ARTIFACTS_BUCKET }}/ui/$VERSION.zip" --no-progress

      - name: Tag the commit
        run: |
          git tag "ui/$VERSION"
          git push origin "ui/$VERSION"
